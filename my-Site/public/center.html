<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
  <style>
    /* this page lives inside the center box, so no tiled background */
    body { background: var(--box-color); padding: 0; margin: 0; }
    .banner { display: block; width: 105%; height: 100vh; object-fit: contain;}
    /* snow gif layer: covers the whole center box, on top of the image, clicks pass through */
    #snow { position: fixed; inset: 0; pointer-events: none;
            background: url("images/PixelSnow2.gif") repeat; background-size: 421px 225px;
            image-rendering: pixelated; }
  </style>
</head>
<body>
  <!-- your big center image / banner -->
  <img class="banner" src="images/SFcenter2.png" alt="banner">
  <!-- snow effect: gif is set in the #snow style above -->
  <div id="snow"></div>
</body>
</html>

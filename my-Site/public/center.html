<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
  <style>
    /* this page lives inside the center box, so no tiled background */
    body { background: var(--box-color); padding: 0; margin: 0; }
    .banner { display: block; width: 105%; height: 100vh; object-fit: contain;}
    /* snow layer: covers the whole center box, on top of the knight, clicks pass through */
    #snow { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  </style>
</head>
<body>
  <!-- your big center image / banner -->
  <img class="banner" src="images/background.jpeg" alt="banner">
  <canvas id="snow"></canvas>
  <script>
    // snow drifting down and to the left
    const c = document.getElementById('snow'), ctx = c.getContext('2d');
    const COUNT = 120, WIND = -0.6;  // more flakes / stronger leftward drift
    let w, h, flakes;
    const flake = (anyY) => ({
      x: Math.random() * (w + h * 0.6),          // start further right so the drift covers the box
      y: anyY ? Math.random() * h : -5,
      r: 0.8 + Math.random() * 2,
      vy: 0.4 + Math.random() * 1,
      sway: Math.random() * Math.PI * 2,
    });
    function resize() {
      w = c.width = innerWidth; h = c.height = innerHeight;
      flakes = Array.from({ length: COUNT }, () => flake(true));
    }
    function draw() {
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.shadowColor = 'rgba(93,57,32,0.5)';   // faint brown edge so flakes show on the cream too
      ctx.shadowBlur = 2;
      for (const f of flakes) {
        f.sway += 0.02;
        f.y += f.vy;
        f.x += WIND * f.vy + Math.sin(f.sway) * 0.3;
        if (f.y > h + 5 || f.x < -5) Object.assign(f, flake(false));
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill();
      }
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches) requestAnimationFrame(draw);
    }
    addEventListener('resize', resize);
    resize(); draw();
  </script>
</body>
</html>
